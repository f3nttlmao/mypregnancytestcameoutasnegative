<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my pregnancy test came out as negative</title>
  <link rel="icon" type="image/png" href="Untitled design (16).png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    body {
      background: #0a0a0a;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      width: 90%;
    }

    .cover {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 30px;
    }

    iframe {
      margin-top: 10px;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #555;
    }

    a {
      color: #aaa;
      text-decoration: none;
      transition: 0.2s;
    }

    a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Untitled design (16).png" alt="Album Cover" class="cover" />

    <h1>my pregnancy test came out as negative</h1>
    <div class="subtitle">upcoming album</div>

    <iframe style="border-radius: 24px" src="https://untitled.stream/embed/GSJXMEp9I24n" width="100%" height="192" allowfullscreen="" allow="picture-in-picture" frameborder="0" loading="lazy"></iframe>

    <div class="footer">
      <p>dropping on may 26</p>
    </div>
  </div>
</body>
</html>
